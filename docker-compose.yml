services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: trade_ai_db
    environment:
      POSTGRES_DB: trade_ai
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d trade_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trade_ai_network

  # One-shot schema owner. Application processes never call create_all.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      - DATABASE_URL=postgresql+pg8000://admin:password@db:5432/trade_ai
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trade_ai_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: trade_ai_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - trade_ai_network
      - ai_gateway_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade_ai_backend
    environment:
      - DATABASE_URL=postgresql+pg8000://admin:password@db:5432/trade_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=False
      - LLM_BACKEND=${LLM_BACKEND:-direct}
      - OMNIROUTE_BASE_URL=http://omniroute:20128
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
      - OMNIROUTE_API_KEY_FILE=${OMNIROUTE_API_KEY_FILE:-}
      - OMNIROUTE_ALLOWED_PROVIDERS=${OMNIROUTE_ALLOWED_PROVIDERS:-[]}
      - OMNIROUTE_MODEL_LEAD_CLASSIFICATION=${OMNIROUTE_MODEL_LEAD_CLASSIFICATION:-}
      - OMNIROUTE_MODEL_MESSAGE_DRAFT=${OMNIROUTE_MODEL_MESSAGE_DRAFT:-}
      - OMNIROUTE_MODEL_LIVE_REPLY=${OMNIROUTE_MODEL_LIVE_REPLY:-}
      - OMNIROUTE_MODEL_RAG_QUERY_REWRITE=${OMNIROUTE_MODEL_RAG_QUERY_REWRITE:-}
      - OMNIROUTE_MODEL_SUMMARIZATION=${OMNIROUTE_MODEL_SUMMARIZATION:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - trade_ai_network
      - ai_gateway_network

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade_ai_celery_worker
    command: celery -A app.tasks.celery_worker worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+pg8000://admin:password@db:5432/trade_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=False
      - LLM_BACKEND=${LLM_BACKEND:-direct}
      - OMNIROUTE_BASE_URL=http://omniroute:20128
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
      - OMNIROUTE_API_KEY_FILE=${OMNIROUTE_API_KEY_FILE:-}
      - OMNIROUTE_ALLOWED_PROVIDERS=${OMNIROUTE_ALLOWED_PROVIDERS:-[]}
      - OMNIROUTE_MODEL_LEAD_CLASSIFICATION=${OMNIROUTE_MODEL_LEAD_CLASSIFICATION:-}
      - OMNIROUTE_MODEL_MESSAGE_DRAFT=${OMNIROUTE_MODEL_MESSAGE_DRAFT:-}
      - OMNIROUTE_MODEL_LIVE_REPLY=${OMNIROUTE_MODEL_LIVE_REPLY:-}
      - OMNIROUTE_MODEL_RAG_QUERY_REWRITE=${OMNIROUTE_MODEL_RAG_QUERY_REWRITE:-}
      - OMNIROUTE_MODEL_SUMMARIZATION=${OMNIROUTE_MODEL_SUMMARIZATION:-}
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - exports:/app/exports
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - trade_ai_network
      - ai_gateway_network

  # Internal AI Gateway. It is opt-in and never publishes a host port.
  omniroute:
    profiles: [gateway]
    build:
      context: https://github.com/diegosouzapw/OmniRoute.git#e0ce95c592c00f100f5141371dbda976d678ddee
      target: runner-base
    image: b-agent/omniroute:e0ce95c592c0
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      - API_HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379/4
      - NODE_OPTIONS=--max-old-space-size=2048
    expose:
      - "20128"
      - "20129"
    volumes:
      - omniroute_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    networks:
      - ai_gateway_network
      - ai_provider_egress_network

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade_ai_celery_beat
    command: celery -A app.tasks.celery_worker beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    environment:
      - DATABASE_URL=postgresql+pg8000://admin:password@db:5432/trade_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
      - SECRET_KEY=your-secret-key-change-in-production
      - DEBUG=False
    volumes:
      - ./backend:/app
      - celery_beat_data:/var/lib/celery
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - trade_ai_network

  # Celery Flower (Monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trade_ai_flower
    command: celery -A app.tasks.celery_worker flower --port=5555
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/3
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trade_ai_network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: trade_ai_frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_HMR_HOST=${VITE_HMR_HOST:-}
      - VITE_HMR_CLIENT_PORT=${VITE_HMR_CLIENT_PORT:-3000}
      - VITE_USE_POLLING=${VITE_USE_POLLING:-true}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - trade_ai_network

  # Nginx (Reverse Proxy - Optional)
  nginx:
    image: nginx:alpine
    container_name: trade_ai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - trade_ai_network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  uploads:
  exports:
  celery_beat_data:
  omniroute_data:
  frontend_node_modules:

networks:
  trade_ai_network:
    driver: bridge
  ai_gateway_network:
    driver: bridge
    internal: true
  ai_provider_egress_network:
    driver: bridge
